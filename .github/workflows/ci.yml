name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Quality chain of the go-book
        run: scripts/check.sh
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build every release archive from a throwaway tag
        run: |
          git tag v0.0.0-dryrun
          scripts/release.sh v0.0.0-dryrun "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP/dist"
          sha256sum -c checksums.txt
          test "$(ls herrscher_v0.0.0-dryrun_* | wc -l)" -eq 6
      - name: Install the linux archive with the install script
        run: |
          cd "$RUNNER_TEMP/dist"
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          for attempt in $(seq 1 20); do
            curl -fsS -o /dev/null http://127.0.0.1:8765/ && break
            test "$attempt" -lt 20
            sleep 0.5
          done
          mkdir -p releases/download/v0.0.0-dryrun
          cp herrscher_* checksums.txt releases/download/v0.0.0-dryrun/
          sed 's#https://github.com/$repo/releases#http://127.0.0.1:8765/releases#' "$GITHUB_WORKSPACE/scripts/install.sh" > install-local.sh
          test "$(grep -c 127.0.0.1:8765 install-local.sh)" -eq 2
          HERRSCHER_VERSION=v0.0.0-dryrun HERRSCHER_INSTALL_DIR="$RUNNER_TEMP/bin" sh install-local.sh
          "$RUNNER_TEMP/bin/herrscher" version | grep -F 0.0.0-dryrun
  e2e-ssh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Open an sshd to the runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          ssh-keygen -q -t ed25519 -N '' -f "$HOME/.ssh/id_ed25519"
          cat "$HOME/.ssh/id_ed25519.pub" >> "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          ssh-keyscan -t ed25519 127.0.0.1 >> "$HOME/.ssh/known_hosts"
          sudo systemctl start ssh
          ssh -o BatchMode=yes runner@127.0.0.1 true
      - name: Remote end-to-end tests over ssh
        env:
          HERRSCHER_E2E_SSH: runner@127.0.0.1
          HERRSCHER_E2E_DEDICATED: "1"
        run: |
          set -o pipefail
          GOWORK=off go test -v -count=1 -timeout 2m -run '^TestE2E' ./core/host/ | tee e2e.log
          if grep -q -- '--- SKIP' e2e.log; then
            echo "an end-to-end test was skipped, the ssh target was not used" >&2
            exit 1
          fi
  windows-lock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Lock tests on Windows (LockFileEx)
        run: go test -v -count=1 -run '^(TestLock|TestReleasedLock|TestStateLock|TestCacheLock)' ./core/host/
      - name: File lock package on Windows (LockFileEx, reparse points)
        run: go test -v -count=1 ./core/internal/filelock/
      - name: Two authority gates in one process serialise through the lock file
        run: go test -v -count=1 -run '^TestTwoGatesInOneProcessSerialiseThroughTheLockFile$' ./core/internal/devices/
      - name: Accept retry tests on Windows (transient Win32 codes)
        run: go test -v -count=1 -run '^TestAcceptRetriesEachTransientErrno$' ./core/internal/control/
      - name: Binary swap while older generations still run
        run: go test -v -count=1 -run '^TestSwapBinaryWhileEveryGenerationStillRunsOnWindows$' ./manage/
      - name: Bridge cancellation kills the process tree and releases the worktree (taskkill)
        run: go test -v -count=1 -run '^TestConfiguredBridgeCancellationTerminatesDescendantHoldingWorktree$' ./core/internal/supervisor/
